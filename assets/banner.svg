<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Dmytro Chornyi</title>
  <desc id="d">Rust, AI tooling and full-stack TypeScript. M.Sc. AI student in Łódź, Poland.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b22"/>
      <stop offset="1" stop-color="#2a1a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#e05d2b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <g id="cog">
      <path fill="none" stroke-width="10" d="M0-92 L14-92 L18-72 L34-66 L50-80 L62-70 L54-50 L64-36 L84-36 L88-22 L68-12 L68 4 L88 14 L84 28 L64 28 L56 44 L66 62 L54 72 L36 58 L20 64 L16 86 L0 88 L-16 86 L-20 64 L-36 58 L-54 72 L-66 62 L-56 44 L-64 28 L-84 28 L-88 14 L-68 4 L-68-12 L-88-22 L-84-36 L-64-36 L-54-50 L-62-70 L-50-80 L-34-66 L-18-72 L-14-92 Z"/>
      <circle r="30" fill="none" stroke-width="10"/>
    </g>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- cogs -->
  <g transform="translate(1030 150)" stroke="#e05d2b" stroke-opacity="0.35">
    <use href="#cog">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(1138 64) scale(0.55)" stroke="#f2a65a" stroke-opacity="0.3">
    <use href="#cog">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(1140 244) scale(0.4)" stroke="#f2a65a" stroke-opacity="0.2">
    <use href="#cog">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- text -->
  <rect x="72" y="78" width="6" height="146" rx="3" fill="url(#accent)"/>
  <text x="104" y="132" fill="#f0f6fc" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Dmytro Chornyi</text>
  <text x="106" y="178" fill="url(#accent)" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600">Rust · AI tooling · full-stack TypeScript</text>
  <text x="106" y="218" fill="#8b949e" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19">M.Sc. AI student · Łódź, Poland · open to junior developer roles</text>
</svg>
